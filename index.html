<!DOCTYPE html>
<html lang="fr">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>evoX WebUI Manager</title>
<style>
/* ==========================================================================
   1. STYLES DE BASE ET LAYOUT PC / PS5
   ========================================================================== */
:root {
  --bg: #020711;
  --panel: #07111f;
  --panel2: #091827;
  --line: #12345a;
  --blue: #00aaff;
  --blue2: #006eff;
  --text: #f4f8ff;
  --muted: #7e91aa;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  font-family: Inter, Segoe UI, Arial, sans-serif;
  color: var(--text);
  background: var(--bg);
  overflow: hidden;
}

body {
  background: radial-gradient(circle at 75% 10%, #06325c55, transparent 32%),
              radial-gradient(circle at 90% 85%, #006eff22, transparent 28%),
              #020711;
}

.app {
  height: 100vh;
  display: grid;
  grid-template-columns: 240px 1fr;
  overflow: hidden;
}

/* SIDEBAR FIXE */
.sidebar {
  border-right: 1px solid #0c2b4b;
  background: #030a14e8;
  padding: 24px 16px;
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow-y: auto;
}

.logo {
  font-size: 34px;
  font-weight: 800;
  letter-spacing: -2px;
  padding: 0 14px 20px;
  cursor: pointer;
  flex-shrink: 0;
}
.logo span { color: var(--blue); }

.nav {
  display: flex;
  flex-direction: column;
  gap: 5px;
  flex: 1;
}

.nav a {
  display: flex;
  gap: 13px;
  align-items: center;
  color: #aebed1;
  text-decoration: none;
  padding: 11px 15px;
  border-radius: 12px;
  transition: .2s;
  cursor: pointer;
  font-size: 14px;
}

.nav a img {
  width: 16px;
  height: 16px;
  object-fit: contain;
}

.nav a:hover, .nav a.active {
  color: #fff;
  background: linear-gradient(90deg, #006eff35, #00aaff08);
  box-shadow: inset 2px 0 var(--blue);
}

.sidebar-footer {
  margin-top: auto;
  border-top: 1px solid #0c2b4b;
  padding-top: 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  flex-shrink: 0;
}

.host-config {
  background: #050f1d;
  border: 1px solid #12345a;
  padding: 10px;
  border-radius: 12px;
}

.host-config label {
  font-size: 11px;
  color: var(--muted);
  display: block;
  margin-bottom: 5px;
}

.host-config select, .host-config input {
  width: 100%;
  background: #020711;
  border: 1px solid #174d78;
  color: #fff;
  padding: 6px 8px;
  border-radius: 8px;
  font-size: 12px;
  outline: none;
}

.host-config input { margin-top: 6px; }

/* CONTENU PRINCIPAL */
main {
  height: 100vh;
  overflow-y: auto;
  padding: 30px clamp(20px, 4vw, 55px);
  width: 100%;
}

.main-wrapper {
  max-width: 1500px;
  margin: 0 auto;
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  margin-bottom: 38px;
}

.kicker {
  color: var(--blue);
  font-size: 12px;
  letter-spacing: 3px;
  text-transform: uppercase;
}

.title {
  font-size: clamp(34px, 5vw, 66px);
  line-height: 1;
  margin: 8px 0 10px;
  letter-spacing: -3px;
}

.subtitle {
  color: var(--muted);
  font-size: 15px;
}

/* ==========================================================================
   2. COMPOSANTS DASHBOARD & CARTES AVEC COMPATIBILITÉ ICONES
   ========================================================================== */
.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
}

@keyframes cardAppear {
  from { opacity: 0; transform: translateY(20px) scale(0.97); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.card, .credit-card {
  position: relative;
  min-height: 210px;
  padding: 25px;
  border: 1px solid #10355a;
  border-radius: 20px;
  background: linear-gradient(145deg, #091827e8, #040c16e8);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  opacity: 0;
  animation: cardAppear 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.3s ease, box-shadow 0.3s ease;
}

.card:before, .credit-card:before {
  content: "";
  position: absolute;
  inset: auto -20% -55% 25%;
  height: 160px;
  background: #007bff25;
  filter: blur(45px);
  border-radius: 50%;
  transition: opacity 0.3s ease, transform 0.3s ease;
  opacity: 0.5;
}

.card:hover:before, .credit-card:hover:before {
  opacity: 1;
  transform: scale(1.2);
}

.card:hover, .credit-card:hover {
  transform: translateY(-8px) scale(1.015);
  border-color: var(--blue);
  box-shadow: 0 20px 40px rgba(0, 170, 255, 0.15), 0 0 15px rgba(0, 170, 255, 0.1);
}

.icon {
  width: 58px;
  height: 58px;
  display: grid;
  place-items: center;
  border-radius: 15px;
  background: #071c30;
  border: 1px solid #1477b9;
  margin-bottom: 22px;
  overflow: hidden;
  transition: transform 0.3s ease, border-color 0.3s ease;
}

.icon img {
  width: 28px;
  height: 28px;
  object-fit: contain;
  filter: drop-shadow(0 0 4px #00aaff);
}

/* STYLE BULLE RONDE SPECIFIQUE POUR LES AVATARS EXPLOIT / TWITTER */
.icon.avatar-icon {
  border-radius: 50%;
  border: 2px solid var(--blue);
}

.icon.avatar-icon img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
  filter: none;
}

.card:hover .icon {
  transform: scale(1.1) rotate(4deg);
  border-color: var(--blue);
}

.card h2 { margin: 0 0 7px; font-size: 21px; }
.desc { color: #8295aa; font-size: 13px; line-height: 1.5; }
.count { position: absolute; right: 22px; top: 22px; border: 1px solid #174d78; padding: 5px 9px; border-radius: 8px; font-size: 11px; color: #80cfff; }

.open {
  display: inline-flex;
  margin-top: auto;
  padding: 10px 16px;
  border: 1px solid var(--blue);
  border-radius: 10px;
  color: #fff;
  text-decoration: none;
  font-size: 13px;
  background: #007bff12;
  width: fit-content;
  transition: background 0.2s ease, transform 0.2s ease;
}

.card:hover .open {
  background: #007bff33;
  transform: translateX(4px);
}

/* ==========================================================================
   3. LECTEUR RSS STYLE FRESHRSS
   ========================================================================== */
.rss-feed-container {
  display: flex;
  flex-direction: column;
  gap: 12px;
  max-width: 900px;
  margin: 0 auto;
}

.rss-item-card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 18px 22px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  transition: border-color 0.2s ease, background 0.2s ease;
  animation: cardAppear 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.rss-item-card:hover {
  border-color: var(--blue);
  background: var(--panel2);
}

.rss-item-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
}

.rss-item-source {
  color: var(--blue);
  font-weight: 600;
  background: rgba(0, 170, 255, 0.1);
  padding: 2px 8px;
  border-radius: 6px;
  border: 1px solid rgba(0, 170, 255, 0.2);
}

.rss-item-date { color: var(--muted); }
.rss-item-title { font-size: 18px; font-weight: 700; color: #fff; text-decoration: none; line-height: 1.3; }
.rss-item-title:hover { color: var(--blue); }
.rss-item-desc { font-size: 13px; color: #aebed1; line-height: 1.5; word-break: break-word; }
.rss-item-footer { margin-top: 4px; }
.rss-item-link { font-size: 12px; color: var(--blue); text-decoration: none; font-weight: 600; }
.rss-item-link:hover { text-decoration: underline; }

/* ==========================================================================
   4. CRÉDITS ET FOOTER
   ========================================================================== */
.credits-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; max-width: 900px; }
.credit-card { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 35px 25px; text-decoration: none; color: var(--text); border-radius: 24px; }
.avatar { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 3px solid var(--blue); background: #071c30; margin-bottom: 20px; box-shadow: 0 8px 25px #00000088; transition: transform 0.3s ease; }
.credit-card:hover .avatar { transform: scale(1.05); }
.credit-info h3 { margin: 0 0 6px; font-size: 22px; color: #fff; }
.credit-info p { margin: 0 0 14px; font-size: 14px; color: var(--muted); line-height: 1.4; }
.credit-role { display: inline-block; font-size: 12px; color: var(--blue); background: #007bff15; padding: 4px 12px; border-radius: 8px; border: 1px solid #124d7c; font-weight: 600; }

footer { color: #526a83; text-align: center; margin-top: 38px; font-size: 12px; padding-bottom: 20px; }

@media(max-width:900px) {
  .app { grid-template-columns: 75px 1fr; }
  .logo { font-size: 22px; padding: 10px 8px 25px; }
  .nav a { justify-content: center; font-size: 0; }
  .nav a img { width: 20px; height: 20px; }
  .grid { grid-template-columns: repeat(2, 1fr); }
  .credits-grid { grid-template-columns: 1fr; }

@media(max-width:600px) {

  .sidebar { height: auto; border-right: none; border-bottom: 1px solid #0c2b4b; }
  main { height: auto; overflow: visible; padding: 24px 16px; }
  .top { align-items: flex-start; flex-direction: column; }
  .grid { grid-template-columns: 1fr; }
  .title { font-size: 42px; }
}
</style>

/* ==========================================================================
   LECTEUR RSS
   ========================================================================== */
async function fetchRepoNews(repoUrl) {
  try {
    const cleanUrl = repoUrl.replace(/\/$/, "");
    const parts = cleanUrl.split("github.com/")[1]?.split("/");
    if (!parts || parts.length < 2) return [];

    const owner = parts[0];
    const repo = parts[1];
    
    const rssFeedUrl = `https://github.com/${owner}/${repo}/releases.atom`;
    const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssFeedUrl)}`;

    const res = await fetch(apiUrl);
    if (!res.ok) return [];

    const data = await res.json();
    if (data.status !== 'ok' || !data.items || data.items.length === 0) return [];

    return data.items.map(item => {
      let cleanDesc = (item.description || item.content || "").replace(/<[^>]*>?/gm, '').trim();
      if (cleanDesc.length > 220) cleanDesc = cleanDesc.substring(0, 220) + "...";

      return {
        title: item.title || `${repo} Nouvelle version`,
        source: `${owner}/${repo}`,
        date: new Date(item.pubDate || Date.now()),
        link: item.link || repoUrl,
        description: cleanDesc
      };
    });
  } catch (err) {
    return [];
  }
}

async function fetchGlobalFeed() {
  const container = document.getElementById('rss-articles-container');
  if (!container) return;

  if (REPOSITORIES.length === 0) {
    container.innerHTML = `<div style="color:var(--muted); padding:30px; text-align:center;">Aucune URL de dépôt renseignée dans le tableau REPOSITORIES.</div>`;
    return;
  }

  container.innerHTML = `<div style="color:var(--muted); padding:30px; text-align:center;">Chargement des nouveautés depuis ${REPOSITORIES.length} dépôt(s)...</div>`;

  try {
    const promises = REPOSITORIES.map(url => fetchRepoNews(url));
    const results = await Promise.all(promises);
    let articles = results.flat();

    articles.sort((a, b) => b.date - a.date);

    if (articles.length === 0) {
      container.innerHTML = `<div style="color:var(--muted); padding:30px; text-align:center;">Aucune version récente trouvée sur les dépôts configurés.</div>`;
      return;
    }

    const htmlList = articles.map(item => {
      const dateFormatted = item.date.getTime() > 0 
        ? item.date.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' })
        : 'Récemment';

      return `
        <article class="rss-item-card">
          <div class="rss-item-header">
            <span class="rss-item-source">${item.source}</span>
            <span class="rss-item-date">${dateFormatted}</span>
          </div>
          <a class="rss-item-title" href="${item.link}" target="_blank" rel="noopener">${item.title}</a>
          ${item.description ? `<div class="rss-item-desc">${item.description}</div>` : ''}
          <div class="rss-item-footer">
            <a class="rss-item-link" href="${item.link}" target="_blank" rel="noopener">Consulter la release sur GitHub →</a>
          </div>
        </article>
      `;
    }).join('');

    container.innerHTML = `<div class="rss-feed-container">${htmlList}</div>`;

  } catch (err) {
    container.innerHTML = `<div style="color:#f87171; padding:30px; text-align:center;">Erreur de chargement du flux : ${err.message}</div>`;
  }
}

/* ==========================================================================
   RENDU GLOBAL
   ========================================================================== */
function render() {
  renderSidebar();
  const container = document.getElementById('main-content');
  const kicker = document.getElementById('view-kicker');
  const title = document.getElementById('view-title');
  const subtitle = document.getElementById('view-subtitle');

  if (currentView === 'dashboard') {
    kicker.textContent = "evoX ecosystem";
    title.textContent = "WebUI Manager";
    subtitle.textContent = "Centralise et lance toutes tes interfaces WebUI locales.";
    
    container.className = "grid";
    const totalCategories = WEBUI.categories.length;
    let cols = 3;
    if (totalCategories === 4 || totalCategories === 8 || totalCategories === 7) cols = 4;

    container.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    container.innerHTML = WEBUI.categories.map((c, index) => `
      <article class="card" onclick="switchView('category', '${c.id}')" style="cursor:pointer; animation-delay: ${index * 0.05}s;">
        <span class="count">${c.links.length} lien${c.links.length > 1 ? 's' : ''}</span>
        <div class="icon"><img src="${c.iconImg}" alt=""></div>
        <h2>${c.name}</h2>
        <div class="desc">${c.description}</div>
        <div class="open">Explorer →</div>
      </article>
    `).join('');

  } else if (currentView === 'whats-new') {
    kicker.textContent = "Flux Releases GitHub";
    title.textContent = "What's new";
    subtitle.textContent = "Dernières releases des dépôts suivis (du plus récent au plus ancien).";

    container.className = "";
    container.innerHTML = `<div id="rss-articles-container"></div>`;
    fetchGlobalFeed();

  } else if (currentView === 'exploit') {
    if (!activeExploitSource) {
      kicker.textContent = "Exécution WebKit";
      title.textContent = "Run Exploit";
      subtitle.textContent = "Choisis la source d'exploit WebKit à exécuter.";

      container.className = "grid";
      const totalSources = EXPLOIT_SOURCES.length;
      let cols = 3;
      if (totalSources === 4 || totalSources === 8 || totalSources === 7) cols = 4;
      container.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

      container.innerHTML = EXPLOIT_SOURCES.map((s, index) => `
        <article class="card" onclick="switchView('exploit', null, '${s.id}')" style="cursor:pointer; animation-delay: ${index * 0.05}s;">
          <span class="count">WebKit</span>
          <div class="icon avatar-icon"><img src="${s.iconImg}" alt="${s.name}"></div>
          <h2>${s.name}</h2>
          <div class="desc">${s.description}</div>
          <div class="open">Lancer →</div>
        </article>
      `).join('');
    } else {
      const source = EXPLOIT_SOURCES.find(s => s.id === activeExploitSource);
      if (!source) return switchView('exploit');

      kicker.textContent = "Exécution WebKit";
      title.textContent = source.name;
      subtitle.textContent = source.description;

      container.className = "";
      container.innerHTML = `
        <div style="margin-bottom: 15px;">
          <button onclick="switchView('exploit')" style="background: #007bff12; border: 1px solid var(--blue); color: #fff; padding: 8px 16px; border-radius: 10px; cursor: pointer; font-size: 13px; transition: 0.2s;">
            ← Changer de source
          </button>
        </div>
        <div style="width: 100%; height: calc(100vh - 250px); border-radius: 16px; overflow: hidden; border: 1px solid var(--line); background: #000;">
          <iframe src="${source.url}" style="width: 100%; height: 100%; border: none;" allowfullscreen></iframe>
        </div>
      `;
    }

  } else if (currentView === 'category') {
    const cat = WEBUI.categories.find(c => c.id === activeCategory);
    if (!cat) return switchView('dashboard');

    kicker.textContent = "Catégorie";
    title.textContent = cat.name;
    subtitle.textContent = cat.description;

    container.className = "grid";
    const totalLinks = cat.links.length;
    let cols = 3;
    if (totalLinks === 4 || totalLinks === 8 || totalLinks === 7) cols = 4;
    container.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

    container.innerHTML = cat.links.map((l, index) => {
      const targetUrl = l.url || (l.port !== null ? `http://${WEBUI.host}:${l.port}` : '#');
      const hasLink = l.url || l.port !== null;
      const badgeText = l.url ? 'URL Directe' : (l.port ? `Port : ${l.port}` : 'Non disponible');
      
      return `
        <article class="card" ${hasLink ? `onclick="window.open('${targetUrl}', '_blank')"` : ''} style="${hasLink ? 'cursor:pointer;' : 'opacity:0.6;'} animation-delay: ${index * 0.05}s;">
          <span class="count" style="${hasLink ? '' : 'color:#f87171; border-color:#7f1d1d;'}">${badgeText}</span>
          <div class="icon"><img src="${l.iconImg}" alt=""></div>
          <h2>${l.name}</h2>
          <div class="desc">${l.description}</div>
          ${hasLink ? `<a class="open" href="${targetUrl}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Ouvrir →</a>` : `<div class="open" style="border-color:#475569; color:#94a3b8; background:transparent;">Non disponible</div>`}
        </article>
      `;
    }).join('');

  } else if (currentView === 'credits') {
    kicker.textContent = "À propos";
    title.textContent = "Crédits";
    subtitle.textContent = "Développeurs et contributeurs du projet.";

    container.className = "credits-grid";
    container.style.gridTemplateColumns = "";
    container.innerHTML = `
      <a class="credit-card" href="https://x.com/nexgen999" target="_blank" rel="noopener" style="animation-delay: 0s;">
        <img class="avatar" src="https://pbs.twimg.com/profile_images/2037201736910213120/p9wyelOV_400x400.jpg" alt="nexgen999">
        <div class="credit-info">
          <h3>nexgen999</h3>
          <p>Développeur principal & Concepteur de l'écosystème</p>
          <span class="credit-role">@nexgen999</span>
        </div>
      </a>
      <a class="credit-card" href="https://x.com/MikeleMedia" target="_blank" rel="noopener" style="animation-delay: 0.08s;">
        <img class="avatar" src="https://pbs.twimg.com/profile_images/2076330418383581184/_OMprq4c_400x400.jpg" alt="Michele Media">
        <div class="credit-info">
          <h3>Michele Media</h3>
          <p>Développeur & Support technique & Concepteur de l'eboot</p>
          <span class="credit-role">@MikeleMedia</span>
        </div>
      </a>
    `;
  }
}

render();
</script>
</body>
</html>
