<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>evoX WebUI Manager</title>
<style>
:root{--bg:#020711;--panel:#07111f;--panel2:#091827;--line:#12345a;--blue:#00aaff;--blue2:#006eff;--text:#f4f8ff;--muted:#7e91aa}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--text);background:var(--bg)}
body{overflow:auto;background:radial-gradient(circle at 75% 10%,#06325c55,transparent 32%),radial-gradient(circle at 90% 85%,#006eff22,transparent 28%),#020711}
.app{min-height:100vh;display:grid;grid-template-columns:230px 1fr}
.sidebar{border-right:1px solid #0c2b4b;background:#030a14e8;padding:28px 16px;display:flex;flex-direction:column}
.logo{font-size:34px;font-weight:800;letter-spacing:-2px;padding:0 14px 30px;cursor:pointer}.logo span{color:var(--blue)}
.nav{display:flex;flex-direction:column;gap:5px;flex:1}
.nav a{display:flex;gap:13px;align-items:center;color:#aebed1;text-decoration:none;padding:13px 15px;border-radius:12px;transition:.2s;cursor:pointer}
.nav a:hover,.nav a.active{color:#fff;background:linear-gradient(90deg,#006eff35,#00aaff08);box-shadow:inset 2px 0 var(--blue)}
.sidebar-footer{margin-top:auto;border-top:1px solid #0c2b4b;padding-top:16px;display:flex;flex-direction:column;gap:10px}
.host-config{background:#050f1d;border:1px solid #12345a;padding:10px;border-radius:12px}
.host-config label{font-size:11px;color:var(--muted);display:block;margin-bottom:5px}
.host-config select,.host-config input{width:100%;background:#020711;border:1px solid #174d78;color:#fff;padding:6px 8px;border-radius:8px;font-size:12px;outline:none}
.host-config input{margin-top:6px}
main{padding:30px clamp(20px,4vw,55px);max-width:1500px;width:100%;margin:auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:38px}
.kicker{color:var(--blue);font-size:12px;letter-spacing:3px;text-transform:uppercase}.title{font-size:clamp(34px,5vw,66px);line-height:1;margin:8px 0 10px;letter-spacing:-3px}.subtitle{color:var(--muted);font-size:15px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{position:relative;min-height:210px;padding:25px;border:1px solid #10355a;border-radius:20px;background:linear-gradient(145deg,#091827e8,#040c16e8);overflow:hidden;transition:.25s;display:flex;flex-direction:column}
.card:before{content:"";position:absolute;inset:auto -20% -55% 25%;height:160px;background:#007bff25;filter:blur(45px);border-radius:50%}
.card:hover{transform:translateY(-5px);border-color:#138de0;box-shadow:0 15px 45px #001d3c88}
.icon{width:58px;height:58px;display:grid;place-items:center;border-radius:15px;background:#071c30;border:1px solid #1477b9;margin-bottom:22px;overflow:hidden}
.icon img{width:28px;height:28px;object-fit:contain;filter:drop-shadow(0 0 4px #00aaff)}
.card h2{margin:0 0 7px;font-size:21px}.desc{color:#8295aa;font-size:13px;line-height:1.5}
.count{position:absolute;right:22px;top:22px;border:1px solid #174d78;padding:5px 9px;border-radius:8px;font-size:11px;color:#80cfff}
.open{display:inline-flex;margin-top:auto;padding:10px 16px;border:1px solid var(--blue);border-radius:10px;color:#fff;text-decoration:none;font-size:13px;background:#007bff12;width:fit-content;transition:.2s}
.open:hover{background:#007bff33}

.credits-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px;max-width:900px}
.credit-card{display:flex;flex-direction:column;align-items:center;text-align:center;padding:35px 25px;background:linear-gradient(145deg,#091827e8,#040c16e8);border:1px solid #10355a;border-radius:24px;text-decoration:none;color:var(--text);transition:.25s;position:relative;overflow:hidden}
.credit-card:before{content:"";position:absolute;inset:auto -20% -55% 25%;height:160px;background:#007bff25;filter:blur(45px);border-radius:50%}
.credit-card:hover{border-color:var(--blue);transform:translateY(-5px);box-shadow:0 15px 45px #001d3c88}
.avatar{width:120px;height:120px;border-radius:50%;object-fit:cover;border:3px solid var(--blue);background:#071c30;margin-bottom:20px;box-shadow:0 8px 25px #00000088}
.credit-info h3{margin:0 0 6px;font-size:22px;color:#fff}
.credit-info p{margin:0 0 14px;font-size:14px;color:var(--muted);line-height:1.4}
.credit-role{display:inline-block;font-size:12px;color:var(--blue);background:#007bff15;padding:4px 12px;border-radius:8px;border:1px solid #124d7c;font-weight:600}

footer{color:#526a83;text-align:center;margin-top:38px;font-size:12px}
@media(max-width:900px){.app{grid-template-columns:75px 1fr}.logo{font-size:22px;padding:10px 8px 25px}.nav a{justify-content:center;font-size:0}.nav a:first-letter{font-size:18px}.grid{grid-template-columns:repeat(2,1fr)}.credits-grid{grid-template-columns:1fr}}
@media(max-width:600px){.app{display:block}.sidebar{display:none}main{padding:24px 16px}.top{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}.title{font-size:42px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="logo" onclick="switchView('dashboard')">evo<span>X</span></div>
  <nav class="nav" id="sidebar-nav">
    <!-- Generated dynamically -->
  </nav>
  <div class="sidebar-footer">
    <div class="host-config">
      <label for="host-select">IP Redirection</label>
      <select id="host-select" onchange="handleHostChange(this)">
        <option value="127.0.0.1">127.0.0.1 (Localhost)</option>
        <option value="custom">IP Personnalisée...</option>
      </select>
      <input type="text" id="custom-host-input" placeholder="Ex: 192.168.1.50" style="display:none;" oninput="updateCustomHost(this)">
    </div>
    <a style="display:flex;gap:13px;align-items:center;color:#aebed1;text-decoration:none;padding:13px 15px;border-radius:12px;cursor:pointer;transition:.2s;" id="nav-credits" onclick="switchView('credits')"><img src="https://img.icons8.com/ios-filled/50/00aaff/star.png" style="width:16px;height:16px;"> &nbsp; Crédits</a>
  </div>
</aside>
<main>
  <section class="top">
    <div>
      <div class="kicker" id="view-kicker">evoX ecosystem</div>
      <div class="title" id="view-title">WebUI Manager</div>
      <div class="subtitle" id="view-subtitle">Centralise et lance toutes tes interfaces WebUI locales.</div>
    </div>
  </section>
  <section id="main-content"></section>
  <footer>evoX WebUI Manager · localhost edition</footer>
</main></div>
<script>
const WEBUI = {
  host: "127.0.0.1",
  categories: [
    {
      id: "hen", name: "HEN", iconImg: "https://img.icons8.com/ios-filled/50/00aaff/lightning-bolt.png",
      description: "Interfaces HEN et gestion du système",
      links: [
        { name: "PLDMGR", description: "Payload Manager", port: 8084, iconImg: "https://img.icons8.com/ios-filled/50/00aaff/lightning-bolt.png" },
        { name: "EvoX", description: "Interface EvoX principale", port: 8085, iconImg: "https://img.icons8.com/ios-filled/50/00aaff/lightning-bolt.png" },
        { name: "Prospero Manager", description: "Gestion système Prospero", port: 7070, iconImg: "https://img.icons8.com/ios-filled/50/00aaff/lightning-bolt.png" },
        { name: "Pizza-Hen Toolbox", description: "Pizza-Hen", port: 8080, iconImg: "https://img.icons8.com/ios-filled/50/00aaff/lightning-bolt.png" },
        { name: "Elf-Arsenal", description: "Boîte à outils ELF", port: 6969, iconImg: "https://img.icons8.com/ios-filled/50/00aaff/lightning-bolt.png" },
        { name: "Voidshell", description: "Shell système", port: 7007, iconImg: "https://img.icons8.com/ios-filled/50/00aaff/lightning-bolt.png" },
        { name: "Kura", description: "Interface Kura", port: 8535, iconImg: "https://img.icons8.com/ios-filled/50/00aaff/lightning-bolt.png" }
      ]
    },
    {
      id: "game-management", name: "Game Management", iconImg: "https://img.icons8.com/ios-filled/50/00aaff/controller.png",
      description: "Gestion des jeux et montage",
      links: [
        { name: "Game Compressor", description: "Compression et gestion des ROMs/jeux", port: 5910, iconImg: "https://img.icons8.com/ios-filled/50/00aaff/controller.png" },
        { name: "ShadowMountPlus", description: "Montage avancé de jeux", port: 10101, iconImg: "https://img.icons8.com/ios-filled/50/00aaff/controller.png" }
      ]
    },
    {
      id: "Save", name: "Saves Management", iconImg: "https://img.icons8.com/ios-filled/50/00aaff/save.png",
      description: "Gestion des sauvegardes",
      links: [
        { name: "Garlic SaveMgr", description: "Compression et gestion des sauvegardes", port: 8082, iconImg: "https://img.icons8.com/ios-filled/50/00aaff/save.png" },
        { name: "Garlic Saves", description: "Site web officiel", url: "https://garlicsaves.com", iconImg: "https://img.icons8.com/ios-filled/50/00aaff/save.png" }
      ]
    },
    {
      id: "cheat", name: "Cheat", iconImg: "https://img.icons8.com/ios-filled/50/00aaff/bullseye.png",
      description: "Outils de triche et modification",
      links: [
        { name: "CheatRunner", description: "Moteur de triche et édition mémoire", port: 9999, iconImg: "https://img.icons8.com/ios-filled/50/00aaff/bullseye.png" },
        { name: "Kyline Core", description: "Moteur de triche et édition mémoire", port: 9023, iconImg: "https://img.icons8.com/ios-filled/50/00aaff/bullseye.png" }
      ]
    },
    {
      id: "free-shop", name: "Free Shop", iconImg: "https://img.icons8.com/ios-filled/50/00aaff/shopping-cart.png",
      description: "Boutiques et téléchargements",
      links: [
        { name: "Pegasus-Dl", description: "Téléchargeur Pegasus", port: 6970, iconImg: "https://img.icons8.com/ios-filled/50/00aaff/shopping-cart.png" },
        { name: "Spectrum Library", description: "Bibliothèque Spectrum", port: 7575, iconImg: "https://img.icons8.com/ios-filled/50/00aaff/shopping-cart.png" }
      ]
    },
    {
      id: "server", name: "Server", iconImg: "https://img.icons8.com/ios-filled/50/00aaff/globe.png",
      description: "Serveurs web et utilitaires réseau",
      links: [
        { name: "Zhttp", description: "Serveur HTTP léger", port: 8888, iconImg: "https://img.icons8.com/ios-filled/50/00aaff/globe.png" },
        { name: "PS5 LocalSend", description: "PS5 LocalSend is a local-network file receiver", port: 53317, iconImg: "https://img.icons8.com/ios-filled/50/00aaff/globe.png" },
        { name: "websrv", description: "Serveur web local", port: 8080, iconImg: "https://img.icons8.com/ios-filled/50/00aaff/globe.png" }
      ]
    },
    {
      id: "file-manager", name: "File Manager", iconImg: "https://img.icons8.com/ios-filled/50/00aaff/folder.png",
      description: "Gestionnaires de fichiers",
      links: [
        { name: "BFpilot", description: "Navigateur et gestionnaire de fichiers", port: 5905, iconImg: "https://img.icons8.com/ios-filled/50/00aaff/folder.png" },
        { name: "PS5 Web File Manager", description: "Navigateur et gestionnaire de fichiers", port: 8888, iconImg: "https://img.icons8.com/ios-filled/50/00aaff/folder.png" },
        { name: "PS5 File Explorer", description: "Navigateur et gestionnaire de fichiers", port: 5905, iconImg: "https://img.icons8.com/ios-filled/50/00aaff/folder.png" }
      ]
    }
  ]
};

let currentView = 'dashboard';
let activeCategory = null;

function handleHostChange(select) {
  const customInput = document.getElementById('custom-host-input');
  if (select.value === 'custom') {
    customInput.style.display = 'block';
    if (customInput.value.trim() !== '') {
      WEBUI.host = customInput.value.trim();
    }
  } else {
    customInput.style.display = 'none';
    WEBUI.host = select.value;
  }
}

function updateCustomHost(input) {
  if (input.value.trim() !== '') {
    WEBUI.host = input.value.trim();
  }
}

function switchView(viewId, catId = null) {
  currentView = viewId;
  activeCategory = catId;
  render();
}

function renderSidebar() {
  const nav = document.getElementById('sidebar-nav');
  let html = `<a class="${currentView === 'dashboard' ? 'active' : ''}" onclick="switchView('dashboard')"><img src="https://img.icons8.com/ios-filled/50/00aaff/home.png" style="width:16px;height:16px;"> &nbsp; Dashboard</a>`;
  WEBUI.categories.forEach(c => {
    html += `<a class="${currentView === 'category' && activeCategory === c.id ? 'active' : ''}" onclick="switchView('category', '${c.id}')"><img src="${c.iconImg}" style="width:16px;height:16px;"> &nbsp; ${c.name}</a>`;
  });
  nav.innerHTML = html;

  const creditsBtn = document.getElementById('nav-credits');
  if (currentView === 'credits') {
    creditsBtn.style.color = '#fff';
    creditsBtn.style.background = 'linear-gradient(90deg,#006eff35,#00aaff08)';
    creditsBtn.style.boxShadow = 'inset 2px 0 var(--blue)';
  } else {
    creditsBtn.style.color = '#aebed1';
    creditsBtn.style.background = 'transparent';
    creditsBtn.style.boxShadow = 'none';
  }
}

function render() {
  renderSidebar();
  const container = document.getElementById('main-content');
  const kicker = document.getElementById('view-kicker');
  const title = document.getElementById('view-title');
  const subtitle = document.getElementById('view-subtitle');

  if (currentView === 'dashboard') {
    kicker.textContent = "evoX ecosystem";
    title.textContent = "WebUI Manager";
    subtitle.textContent = "Centralise et lance toutes tes interfaces WebUI locales.";
    
    container.className = "grid";
    const totalCategories = WEBUI.categories.length;
    let cols = 3;
    if (totalCategories === 4 || totalCategories === 8 || totalCategories === 7) {
      cols = 4;
    } else if (totalCategories % 3 !== 0 && totalCategories % 4 === 0) {
      cols = 4;
    }
    container.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

    container.innerHTML = WEBUI.categories.map(c => `
      <article class="card" onclick="switchView('category', '${c.id}')" style="cursor:pointer;">
        <span class="count">${c.links.length} lien${c.links.length > 1 ? 's' : ''}</span>
        <div class="icon"><img src="${c.iconImg}" alt=""></div>
        <h2>${c.name}</h2>
        <div class="desc">${c.description}</div>
        <div class="open">Explorer →</div>
      </article>
    `).join('');
  } else if (currentView === 'category') {
    const cat = WEBUI.categories.find(c => c.id === activeCategory);
    if (!cat) return switchView('dashboard');

    kicker.textContent = "Catégorie";
    title.textContent = cat.name;
    subtitle.textContent = cat.description;

    container.className = "grid";
    const totalLinks = cat.links.length;
    let cols = 3;
    if (totalLinks === 4 || totalLinks === 8 || totalLinks === 7) {
      cols = 4;
    } else if (totalLinks % 3 !== 0 && totalLinks % 4 === 0) {
      cols = 4;
    }
    container.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

    container.innerHTML = cat.links.map(l => {
      const targetUrl = l.url || (l.port !== null ? `http://${WEBUI.host}:${l.port}` : '#');
      const hasLink = l.url || l.port !== null;
      const badgeText = l.url ? 'URL Directe' : (l.port ? `Port : ${l.port}` : 'Non disponible');
      
      return `
        <article class="card" ${hasLink ? `onclick="window.open('${targetUrl}', '_blank')"` : ''} style="${hasLink ? 'cursor:pointer;' : 'opacity:0.6;'}">
          <span class="count" style="${hasLink ? '' : 'color:#f87171; border-color:#7f1d1d;'}">${badgeText}</span>
          <div class="icon"><img src="${l.iconImg}" alt=""></div>
          <h2>${l.name}</h2>
          <div class="desc">${l.description}</div>
          ${hasLink ? `<a class="open" href="${targetUrl}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Ouvrir →</a>` : `<div class="open" style="border-color:#475569; color:#94a3b8; background:transparent;">Non disponible</div>`}
        </article>
      `;
    }).join('');
  } else if (currentView === 'credits') {
    kicker.textContent = "À propos";
    title.textContent = "Crédits";
    subtitle.textContent = "Développeurs et contributeurs du projet.";

    container.className = "credits-grid";
    container.style.gridTemplateColumns = "";
    container.innerHTML = `
      <a class="credit-card" href="https://x.com/nexgen999" target="_blank" rel="noopener">
        <img class="avatar" src="https://pbs.twimg.com/profile_images/2037201736910213120/p9wyelOV_400x400.jpg" alt="nexgen999">
        <div class="credit-info">
          <h3>nexgen999</h3>
          <p>Développeur principal & Concepteur de l'écosystème</p>
          <span class="credit-role">@nexgen999</span>
        </div>
      </a>
      <a class="credit-card" href="https://x.com/MikeleMedia" target="_blank" rel="noopener">
        <img class="avatar" src="https://pbs.twimg.com/profile_images/2076330418383581184/_OMprq4c_400x400.jpg" alt="Michele Media">
        <div class="credit-info">
          <h3>Michele Media</h3>
          <p>Développeur & Support technique & Concepteur de l'eboot</p>
          <span class="credit-role">@MikeleMedia</span>
        </div>
      </a>
    `;
  }
}

render();
</script>
</body>
</html>
